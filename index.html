<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ここえいご</title>
<meta name="theme-color" content="#ff8fb5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4b3550; --ink2:#7a6580; --pink:#ff6f9f; --pink2:#ffb3cb; --pinkL:#fff0f6;
  --purple:#8a7bff; --mint:#3ccf9c; --sun:#ffc93c; --sky:#5bb8ff; --red:#ff6b6b;
  --card:#ffffff; --line:#f3d6e2;
  --bg1:#ffe3ef; --bg2:#fff6fb;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  color:var(--ink); font-size:18px; font-weight:500; line-height:1.55;
  background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%); background-attachment:fixed;
  min-height:100vh; overscroll-behavior-y:none;
}
#app{max-width:820px;margin:0 auto;padding:12px 16px 40px}
button{font-family:inherit;color:inherit;font-size:inherit;border:none;cursor:pointer;background:none}
button:disabled{opacity:.5}
b{font-weight:800}
.en-font{font-family:'M PLUS Rounded 1c',sans-serif;letter-spacing:.01em}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--pink);color:#fff;font-weight:800;padding:12px 22px;border-radius:999px;
  box-shadow:0 5px 0 #e0517f;transition:transform .08s,box-shadow .08s;min-height:52px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #e0517f}
.btn.big{width:100%;font-size:22px;min-height:64px;margin-top:14px}
.btn.sm{padding:8px 14px;min-height:44px;font-size:16px}
.btn.sub{background:#fff;color:var(--pink);box-shadow:0 5px 0 var(--pink2);border:2px solid var(--pink2)}
.btn.sub:active{box-shadow:0 1px 0 var(--pink2)}
.btn.purple{background:var(--purple);box-shadow:0 5px 0 #6656e0}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #24a87b}
.iconbtn{width:46px;height:46px;border-radius:50%;background:#fff;font-size:22px;box-shadow:0 3px 0 var(--line);display:inline-flex;align-items:center;justify-content:center}

/* ---- home ---- */
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.who{display:flex;flex-direction:column;line-height:1.2}
.who b{font-size:20px}
.who small{color:var(--ink2);font-size:13px}
.lv{display:inline-block;background:var(--purple);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:800;margin-right:6px;width:fit-content}
.chips{display:flex;gap:8px;align-items:center}
.chip{background:#fff;border-radius:999px;padding:6px 12px;font-size:16px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.trialbar{background:#fff7d1;border:2px dashed var(--sun);border-radius:14px;padding:6px 12px;font-size:14px;text-align:center;margin:6px 0}
.hero{display:flex;align-items:center;gap:6px;margin:4px 0 6px}
.hero .mimi{width:96px;flex:none}
.stage3d{position:relative;height:250px;border-radius:28px;background:radial-gradient(circle at 50% 38%,#fffdf6 0,#f5ecd9 70%,#efe2c8 100%);box-shadow:0 5px 0 var(--line);overflow:hidden;margin:6px 0 10px}
@media(min-width:620px){.stage3d{height:320px}}
.stage3d canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.t3d{position:absolute;top:10px;left:16px;font-weight:800;font-size:28px;color:var(--pink);pointer-events:none;letter-spacing:.06em;text-shadow:0 2px 0 #fff}
.hint3d{position:absolute;bottom:8px;right:12px;font-size:12px;color:var(--ink2);pointer-events:none}
.hero .bubble{flex:1}
.lesson-card{display:block;width:100%;text-align:left;background:linear-gradient(135deg,#ff7fa9,#ff9a8b);color:#fff;border-radius:var(--r);
  padding:18px 20px;box-shadow:0 6px 0 #e0517f;position:relative;overflow:hidden}
.lesson-card:active{transform:translateY(4px);box-shadow:0 2px 0 #e0517f}
.lesson-card .t{font-size:26px;font-weight:800}
.lesson-card .d{font-size:16px;opacity:.95}
.lesson-card .go{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:40px}
.lesson-card.done{background:linear-gradient(135deg,#3ccf9c,#62d7c4);box-shadow:0 6px 0 #24a87b}
.week{display:flex;justify-content:space-between;background:#fff;border-radius:18px;padding:10px 12px;margin:14px 0;box-shadow:0 3px 0 var(--line)}
.week .d{text-align:center;font-size:13px;color:var(--ink2);flex:1}
.week .s{width:32px;height:32px;margin:2px auto 0;border-radius:50%;background:#f6eef2;display:flex;align-items:center;justify-content:center;font-size:18px}
.week .s.on{background:#ffe6a8}
.week .today .s{outline:3px solid var(--pink2)}
.sec-title{font-weight:800;font-size:18px;margin:18px 4px 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:#fff;border-radius:20px;padding:14px 10px;text-align:center;box-shadow:0 5px 0 var(--line);min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.tile .i{font-size:38px;line-height:1.1}
.tile .n{font-weight:800;font-size:17px}
.tile .h{font-size:12px;color:var(--ink2)}
.eiken{background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:0 4px 0 var(--line);margin-top:14px}
.meter{height:16px;background:#f6eef2;border-radius:999px;overflow:hidden;margin:4px 0 10px}
.meter > i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#ffa4c2);border-radius:999px;transition:width .6s}
.meter.p > i{background:linear-gradient(90deg,var(--purple),#b7adff)}
.small{font-size:14px;color:var(--ink2)}
.notice{background:#fff;border:2px solid #ffd0a8;border-radius:14px;padding:10px 14px;font-size:14px;margin:10px 0}

.set-card{background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:0 6px 0 var(--pink2);border:3px solid var(--pink2)}
.set-card .t{font-size:24px;font-weight:800;color:var(--pink)}
.set-card .d{font-size:15px;color:var(--ink2)}
.set-card.done{border-color:#9be7cb;box-shadow:0 6px 0 #9be7cb}
.set-card.done .t{color:#1fa774}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 2px}
.step{text-align:center;background:#f8f1f4;border-radius:14px;padding:8px 2px}
.step .si{font-size:26px}
.step .sn{font-size:11px;font-weight:800;line-height:1.25}
.step.ok{background:#e4f9f0}
.step.now{background:#ffe3ee;outline:3px solid var(--pink);animation:pulse 1.4s infinite}
@keyframes pulse{50%{outline-color:#ffb3cb}}
.tile.locked{opacity:.45;filter:grayscale(.7)}
.tile.locked .n:after{content:" 🔒"}
/* ---- なかま ---- */
.buddies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
@media(min-width:620px){.buddies{grid-template-columns:repeat(5,1fr)}}
.bud{background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:0}
.bud.on{border-color:var(--pink);background:var(--pinkL)}
.bud .mimi{width:72px}
.bud .small{font-size:11px;line-height:1.3}
/* ---- かたちあそび ---- */
.hl{color:var(--pink);background:#fff0f6;border-radius:6px;padding:0 3px}
.cmp{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.cmpb{background:#fff;border:3px solid #a5d8ff;border-radius:16px;padding:10px 14px;font-size:20px;font-weight:700;box-shadow:0 4px 0 #a5d8ff}
.cmpb:active{transform:translateY(3px);box-shadow:0 1px 0 #a5d8ff}
.cmpv{font-size:22px;color:var(--ink2)}
.rv-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.tile .badge{position:absolute;top:8px;right:10px;background:var(--red);color:#fff;border-radius:999px;font-size:13px;padding:1px 8px;font-weight:800}
.tile{position:relative}
/* ---- わからない・おかわり ---- */
.opts.wait .opt{opacity:.5}
.idk-row{text-align:center;margin-top:12px}
.idk{font-size:15px}
.idk.pulse{animation:idkpulse 1s ease-in-out infinite;border-color:var(--purple);color:var(--purple)}
@keyframes idkpulse{50%{transform:scale(1.08);box-shadow:0 0 0 6px rgba(138,123,255,.25)}}
.okw{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff9db,#fff0f6);border-radius:18px;padding:10px 14px;margin:12px 0 4px}
.okw.open{background:linear-gradient(135deg,#e6fcf5,#fff9db)}
.okw .gift{font-size:44px;line-height:1}
.gift.big{font-size:72px}
.gift.shake{animation:giftshake 2.4s ease-in-out infinite}
.gift.pop{animation:giftpop .9s ease-out infinite alternate}
@keyframes giftshake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-12deg)}80%{transform:rotate(10deg)}85%{transform:rotate(-8deg)}90%{transform:rotate(6deg)}}
@keyframes giftpop{from{transform:scale(1)}to{transform:scale(1.15)}}
.okw-t{font-size:15px;line-height:1.5}
.okw .secret{color:var(--pink);background:#fff;border-radius:8px;padding:0 4px}
/* ---- まちがいさがし ---- */
.mg-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:var(--r);padding:12px 16px;margin-top:12px;box-shadow:0 4px 0 var(--line);position:relative}
.mg-card .mg-ic{font-size:34px}
.mg-card.lock{opacity:.6}
.mg-card.ready{background:linear-gradient(135deg,#fff9db,#fff);border:3px solid #ffd43b;box-shadow:0 5px 0 #fcc419}
.mg-card .go{margin-left:auto;font-size:26px;color:#f59f00}
.mg-paper{background:#fffdf3;border-radius:24px;padding:16px 12px 12px;border:3px dashed #e9c46a;box-shadow:0 5px 0 var(--line);position:relative;margin-top:16px}
.mg-ribbon{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:#e63946;color:#fff;font-weight:800;font-size:19px;padding:4px 26px;border-radius:8px;white-space:nowrap;box-shadow:0 3px 0 #a4161a;letter-spacing:.1em}
.mg-ribbon:before,.mg-ribbon:after{content:"";position:absolute;top:8px;border:12px solid #c1121f;z-index:-1}
.mg-ribbon:before{left:-16px;border-left-color:transparent}
.mg-ribbon:after{right:-16px;border-right-color:transparent}
.mg-info{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;margin:8px 4px 10px}
.mg-stat{display:flex;gap:10px;align-items:center;font-weight:800}
.mg-dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid #e63946;margin-left:4px;vertical-align:middle}
.mg-dot.on{background:#e63946}
.mg-pics{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.mg-pics{grid-template-columns:1fr 1fr}}
.mg-pic{border:3px solid #3d2b40;border-radius:14px;overflow:hidden;background:#fff;touch-action:manipulation}
.mg-pic svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.mg-ok{fill:none;stroke:#e63946;stroke-width:4}
.mg-ans{fill:none;stroke:#4dabf7;stroke-width:4;stroke-dasharray:6 4}
.mg-hint{fill:rgba(255,212,59,.18);stroke:#f59f00;stroke-width:3;stroke-dasharray:8 6}
.mg-x{font-size:26px;font-weight:800;fill:#868e96;animation:xf .7s forwards}
@keyframes xf{to{opacity:0}}
.mg-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
/* ---- mimi（なかまの 表情と うごき） ---- */
.mimi svg{width:100%;height:auto;display:block;overflow:visible}
.mimi{cursor:pointer;-webkit-user-select:none;user-select:none}
.mimi .earL,.mimi .earR{transform-box:fill-box;transform-origin:50% 95%}
.mimi.talking .earL,.mimi.a-ear .earL{animation:wigL .28s ease-in-out infinite alternate}
.mimi.talking .earR,.mimi.a-ear .earR{animation:wigR .28s ease-in-out infinite alternate}
@keyframes wigL{from{transform:rotate(-7deg)}to{transform:rotate(3deg)}}
@keyframes wigR{from{transform:rotate(7deg)}to{transform:rotate(-3deg)}}
.mimi .bodyg{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.985)}}
.mimi .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mimi .pup{transition:transform .25s}
.mimi .m-t{transform-box:fill-box;transform-origin:50% 50%}
/* かくしておくパーツ */
.mimi .e-g,.mimi .e-s,.mimi .e-w,.mimi .e-x,.mimi .m-h,.mimi .m-o,.mimi .m-t,.mimi .m-g,.mimi .m-w,.mimi .sweat,
.mimi .fx-h,.mimi .fx-g,.mimi .fx-q,.mimi .fx-z,.mimi .fx-n{display:none}
/* せいかい：顔はほぼそのまま＋キラキラ */
.mimi.mood-happy .m-n{display:none}.mimi.mood-happy .m-h,.mimi.mood-happy .fx-h{display:inline}
.mimi.mood-happy .bodyg{animation:hop .5s ease-out 2}
/* れんぞくせいかい：にっこり＋ハート＋くるっ */
.mimi.mood-great .eyes,.mimi.mood-great .m-n{display:none}
.mimi.mood-great .e-g,.mimi.mood-great .m-g,.mimi.mood-great .fx-g,.mimi.mood-great .fx-h{display:inline}
.mimi.mood-great .bodyg{animation:spinhop .9s ease-in-out}
/* おしい */
.mimi.mood-oops .m-n{display:none}.mimi.mood-oops .m-o,.mimi.mood-oops .sweat{display:inline}
.mimi.mood-oops .bodyg{animation:shake .45s}
/* がーん（2かい つづけて まちがい） */
.mimi.mood-shock .eyes,.mimi.mood-shock .m-n{display:none}
.mimi.mood-shock .e-x,.mimi.mood-shock .m-o,.mimi.mood-shock .sweat{display:inline}
.mimi.mood-shock .bodyg{animation:shake .45s}
/* かんがえちゅう */
.mimi.mood-think .fx-q{display:inline}
.mimi.mood-think .pup{transform:translate(2px,-3px)}
.mimi.mood-think .bodyg{animation:tilt .4s forwards}
/* ねむい */
.mimi.mood-sleepy .eyes{display:none}.mimi.mood-sleepy .e-s,.mimi.mood-sleepy .fx-z{display:inline}
.mimi.mood-sleepy .bodyg{animation:sway 3s ease-in-out infinite}
/* びっくり */
.mimi.mood-wow .eyes,.mimi.mood-wow .m-n{display:none}
.mimi.mood-wow .e-w,.mimi.mood-wow .m-w,.mimi.mood-wow .fx-n{display:inline}
.mimi.mood-wow .bodyg{animation:boing .45s}
/* しゃべる */
.mimi.talking .m-n,.mimi.talking .m-h,.mimi.talking .m-o,.mimi.talking .m-g,.mimi.talking .m-w{display:none}
.mimi.talking .m-t{display:inline;animation:mouth .18s infinite alternate}
.mimi.talking .bodyg{animation:talkbob .3s ease-in-out infinite alternate}
/* タッチや ひまなときの しぐさ */
.mimi.look-l .pup{transform:translateX(-3px)}
.mimi.look-r .pup{transform:translateX(3px)}
.mimi.look-u .pup{transform:translateY(-3px)}
.mimi.a-wiggle .bodyg{animation:wiggle .6s}
.mimi.a-squish .bodyg{animation:squish .5s}
.mimi.a-spin .bodyg{animation:spinhop .8s ease-in-out}
.mimi.a-hop .bodyg{animation:hop .45s ease-out 2}
.mimi .fx-h{transform-box:fill-box;transform-origin:center;animation:twinkle .6s ease-in-out infinite alternate}
.mimi .fx-g{animation:floatup 1.2s ease-out}
@keyframes twinkle{from{opacity:.5;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
@keyframes floatup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
@keyframes spinhop{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-18px) rotate(180deg)}80%{transform:translateY(-4px) rotate(360deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes tilt{to{transform:rotate(-6deg)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes boing{30%{transform:scale(1.12,.86)}60%{transform:scale(.92,1.1) translateY(-8px)}100%{transform:scale(1)}}
@keyframes wiggle{20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
@keyframes squish{30%{transform:scale(1.15,.8)}60%{transform:scale(.92,1.08)}100%{transform:scale(1)}}
@keyframes mouth{from{transform:scaleY(.6)}to{transform:scaleY(1.1)}}
@keyframes talkbob{from{transform:translateY(0)}to{transform:translateY(-3px)}}

.buddies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
@media(min-width:620px){.buddies{grid-template-columns:repeat(5,1fr)}}
.bud{background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:0}
.bud.on{border-color:var(--pink);background:var(--pinkL)}
.bud .mimi{width:72px}
.bud .small{font-size:11px;line-height:1.3}
/* ---- かたちあそび ---- */
.hl{color:var(--pink);background:#fff0f6;border-radius:6px;padding:0 3px}
.cmp{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.cmpb{background:#fff;border:3px solid #a5d8ff;border-radius:16px;padding:10px 14px;font-size:20px;font-weight:700;box-shadow:0 4px 0 #a5d8ff}
.cmpb:active{transform:translateY(3px);box-shadow:0 1px 0 #a5d8ff}
.cmpv{font-size:22px;color:var(--ink2)}
.rv-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.tile .badge{position:absolute;top:8px;right:10px;background:var(--red);color:#fff;border-radius:999px;font-size:13px;padding:1px 8px;font-weight:800}
.tile{position:relative}
/* ---- わからない・おかわり ---- */
.opts.wait .opt{opacity:.5}
.idk-row{text-align:center;margin-top:12px}
.idk{font-size:15px}
.idk.pulse{animation:idkpulse 1s ease-in-out infinite;border-color:var(--purple);color:var(--purple)}
@keyframes idkpulse{50%{transform:scale(1.08);box-shadow:0 0 0 6px rgba(138,123,255,.25)}}
.okw{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff9db,#fff0f6);border-radius:18px;padding:10px 14px;margin:12px 0 4px}
.okw.open{background:linear-gradient(135deg,#e6fcf5,#fff9db)}
.okw .gift{font-size:44px;line-height:1}
.gift.big{font-size:72px}
.gift.shake{animation:giftshake 2.4s ease-in-out infinite}
.gift.pop{animation:giftpop .9s ease-out infinite alternate}
@keyframes giftshake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-12deg)}80%{transform:rotate(10deg)}85%{transform:rotate(-8deg)}90%{transform:rotate(6deg)}}
@keyframes giftpop{from{transform:scale(1)}to{transform:scale(1.15)}}
.okw-t{font-size:15px;line-height:1.5}
.okw .secret{color:var(--pink);background:#fff;border-radius:8px;padding:0 4px}
/* ---- まちがいさがし ---- */
.mg-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:var(--r);padding:12px 16px;margin-top:12px;box-shadow:0 4px 0 var(--line);position:relative}
.mg-card .mg-ic{font-size:34px}
.mg-card.lock{opacity:.6}
.mg-card.ready{background:linear-gradient(135deg,#fff9db,#fff);border:3px solid #ffd43b;box-shadow:0 5px 0 #fcc419}
.mg-card .go{margin-left:auto;font-size:26px;color:#f59f00}
.mg-paper{background:#fffdf3;border-radius:24px;padding:16px 12px 12px;border:3px dashed #e9c46a;box-shadow:0 5px 0 var(--line);position:relative;margin-top:16px}
.mg-ribbon{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:#e63946;color:#fff;font-weight:800;font-size:19px;padding:4px 26px;border-radius:8px;white-space:nowrap;box-shadow:0 3px 0 #a4161a;letter-spacing:.1em}
.mg-ribbon:before,.mg-ribbon:after{content:"";position:absolute;top:8px;border:12px solid #c1121f;z-index:-1}
.mg-ribbon:before{left:-16px;border-left-color:transparent}
.mg-ribbon:after{right:-16px;border-right-color:transparent}
.mg-info{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;margin:8px 4px 10px}
.mg-stat{display:flex;gap:10px;align-items:center;font-weight:800}
.mg-dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid #e63946;margin-left:4px;vertical-align:middle}
.mg-dot.on{background:#e63946}
.mg-pics{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.mg-pics{grid-template-columns:1fr 1fr}}
.mg-pic{border:3px solid #3d2b40;border-radius:14px;overflow:hidden;background:#fff;touch-action:manipulation}
.mg-pic svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.mg-ok{fill:none;stroke:#e63946;stroke-width:4}
.mg-ans{fill:none;stroke:#4dabf7;stroke-width:4;stroke-dasharray:6 4}
.mg-hint{fill:rgba(255,212,59,.18);stroke:#f59f00;stroke-width:3;stroke-dasharray:8 6}
.mg-x{font-size:26px;font-weight:800;fill:#868e96;animation:xf .7s forwards}
@keyframes xf{to{opacity:0}}
.mg-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
/* ---- mimi ---- */
.mimi svg{width:100%;height:auto;display:block;overflow:visible}
.mimi .earL,.mimi .earR{transform-box:fill-box;transform-origin:50% 95%}
.mimi.talking .earL{animation:wigL .28s ease-in-out infinite alternate}
.mimi.talking .earR{animation:wigR .28s ease-in-out infinite alternate}
@keyframes wigL{from{transform:rotate(-7deg)}to{transform:rotate(3deg)}}
@keyframes wigR{from{transform:rotate(7deg)}to{transform:rotate(-3deg)}}
.mimi .bodyg{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.985)}}
.mimi.mood-happy .bodyg{animation:hop .5s ease-out 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.mimi .e-h,.mimi .e-o,.mimi .m-h,.mimi .m-o,.mimi .m-t,.mimi .sweat{display:none}
.mimi.mood-happy .e-n,.mimi.mood-happy .m-n{display:none}
.mimi.mood-happy .e-h,.mimi.mood-happy .m-h{display:inline}
.mimi.mood-oops .m-n{display:none}
.mimi.mood-oops .m-o,.mimi.mood-oops .sweat{display:inline}
.mimi.talking .m-n,.mimi.talking .m-h,.mimi.talking .m-o{display:none}
.mimi.talking .m-t{display:inline;animation:mouth .18s infinite alternate}
@keyframes mouth{from{transform:scaleY(.6)}to{transform:scaleY(1.1)}}
.mimi .m-t{transform-box:fill-box;transform-origin:50% 50%}
.bubble{background:#fff;border-radius:20px;padding:12px 16px;position:relative;box-shadow:0 3px 0 var(--line);font-weight:700;min-height:48px}
.bubble:before{content:"";position:absolute;left:-12px;top:22px;border:8px solid transparent;border-right:12px solid #fff}
.bubble:empty{visibility:hidden}
.say{display:inline-flex;align-items:center;gap:4px;background:var(--pinkL);border-radius:999px;padding:2px 12px;margin-top:4px;font-weight:800;color:var(--pink)}

/* ---- sub screens ---- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.topbar .ttl{font-weight:800;white-space:nowrap;font-size:16px}
.prog{flex:1;height:14px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.prog .bar{height:100%;width:0;background:linear-gradient(90deg,var(--mint),#8ee6c6);border-radius:999px;transition:width .4s}
.mimi-row{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.mimi-row .mimi{width:86px;flex:none}
.mimi-row .bubble{flex:1;font-size:17px}
.qcard{background:#fff;border-radius:var(--r);padding:18px;text-align:center;box-shadow:0 5px 0 var(--line);margin-bottom:14px}
.qtext{color:var(--ink2);font-size:16px}
.qword{font-size:40px;font-weight:800;margin:6px 0;word-break:break-word}
.qword.ja{font-size:30px}
.qsent{font-size:24px;font-weight:800;margin:6px 0;line-height:1.4}
.playrow{display:flex;justify-content:center;gap:14px;margin-top:8px}
.play{width:84px;height:84px;border-radius:50%;background:var(--sky);color:#fff;font-size:38px;box-shadow:0 6px 0 #3b97de;display:inline-flex;align-items:center;justify-content:center}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #3b97de}
.play.slowb{width:64px;height:64px;font-size:28px;background:#9bd4ff;box-shadow:0 5px 0 #6eb8ec;align-self:center}
.play.mini{width:44px;height:44px;font-size:20px;box-shadow:0 3px 0 #3b97de}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{background:#fff;border-radius:20px;min-height:84px;padding:10px;font-size:22px;font-weight:800;box-shadow:0 5px 0 var(--line);border:3px solid transparent;transition:transform .08s}
.opt:active{transform:translateY(3px)}
.opt.pic{min-height:120px}
.opt.txt{font-size:19px;text-align:left;padding:12px 16px;min-height:64px}
.opt.right{border-color:var(--mint);background:#e7fbf3;animation:pop .35s}
.opt.wrong{border-color:var(--red);background:#ffecec;animation:shake .35s}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.emo{font-size:64px;line-height:1.1;display:inline-block;white-space:nowrap}
.emo .em2{font-size:.72em}.emo .em3{font-size:.55em}
.svgpic svg{width:1.3em;height:1.3em;display:inline-block;vertical-align:middle}
.numpic{font-size:56px;font-weight:800;color:var(--purple);line-height:1.1;display:inline-block}
.txtpic{font-size:24px;font-weight:800;display:inline-block}
.after{margin-top:12px;text-align:center}
.reveal{background:#fff;border-radius:16px;padding:10px 14px;margin-top:10px;font-size:17px;text-align:left}

.wcard{background:#fff;border-radius:28px;padding:20px;text-align:center;box-shadow:0 6px 0 var(--line)}
.wcard .pic .emo{font-size:110px}
.wcard .pic .numpic{font-size:96px}
.wcard .pic .txtpic{font-size:36px;padding:20px 0}
.wcard .en{font-size:46px;font-weight:800;line-height:1.2;margin-top:6px}
.wcard .art{font-size:20px;color:var(--purple);font-weight:800;margin-top:6px;line-height:1}
.wcard .ja{font-size:22px;color:var(--ink2)}
.wcard .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}

/* tiles puzzle */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:62px;background:#fff;border-radius:18px;padding:10px;box-shadow:inset 0 0 0 3px var(--line);margin-bottom:12px}
.slot{min-width:44px;height:52px;border-bottom:4px solid var(--pink2);font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.slot.fill{color:var(--pink)}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.ltile{min-width:56px;height:56px;padding:0 12px;border-radius:16px;background:#fff;font-size:26px;font-weight:800;box-shadow:0 5px 0 var(--line)}
.ltile.w{font-size:20px;height:52px}
.ltile.used{visibility:hidden}
.ltile:active{transform:translateY(3px)}
.chunk{background:var(--pinkL);border-radius:12px;padding:6px 10px;font-size:20px;font-weight:800}
.slots.sent{gap:8px;align-items:center;min-height:70px}

/* zukan */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{background:#fff;border-radius:20px;padding:12px;text-align:center;box-shadow:0 5px 0 var(--line);position:relative}
.cat .i{font-size:40px}
.cat .n{font-weight:800}
.cat .stamp{position:absolute;top:6px;right:8px;font-size:22px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.cards{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:18px;padding:10px 6px;text-align:center;box-shadow:0 4px 0 var(--line);min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card .emo{font-size:46px}
.card .numpic{font-size:38px}
.card .txtpic{font-size:16px;color:var(--ink2)}
.card .e{font-weight:800;font-size:19px;line-height:1.2}
.card .j{font-size:13px;color:var(--ink2)}
.card .dots{font-size:11px;letter-spacing:2px;color:var(--sun)}
.card.new{opacity:.55;filter:grayscale(.6)}

/* abc */
.abc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(min-width:620px){.abc{grid-template-columns:repeat(6,1fr)}}
.abc button{background:#fff;border-radius:18px;padding:8px 4px;box-shadow:0 4px 0 var(--line)}
.abc .L{font-size:30px;font-weight:800;color:var(--pink)}
.abc .L small{font-size:22px;color:var(--purple);margin-left:4px}
.abc .ex{font-size:26px}

/* list rows */
.list{display:flex;flex-direction:column;gap:10px}
.row-btn{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.row-btn .i{font-size:28px}
.row-btn .t{font-weight:800;flex:1}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--pinkL);color:var(--pink);font-weight:800}
.tag.p{background:#eeebff;color:var(--purple)}
.panel{background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:0 4px 0 var(--line);margin-bottom:14px}
.ex-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.ex-row:first-of-type{border-top:none}
.ex-row .e{font-weight:800;font-size:20px}
.ex-row .j{font-size:14px;color:var(--ink2)}

/* result */
.result{background:#fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 6px 0 var(--line)}
.result .score{font-size:56px;font-weight:800;color:var(--pink);line-height:1.1}
.result .st{font-size:24px;font-weight:800;margin:6px 0}
.sec-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:16px}
.sec-table td{padding:6px 4px;border-bottom:1px dashed var(--line)}
.sec-table td:last-child{text-align:right;font-weight:800}

/* dress */
.stage-big{background:#fff;border-radius:28px;padding:10px;display:flex;justify-content:center;box-shadow:0 6px 0 var(--line)}
.stage-big .mimi{width:220px}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
@media(min-width:620px){.shop{grid-template-columns:repeat(4,1fr)}}
.item{background:#fff;border-radius:18px;padding:10px 4px;text-align:center;box-shadow:0 4px 0 var(--line);border:3px solid transparent}
.item .i{font-size:34px}
.item .n{font-size:13px;font-weight:800}
.item .c{font-size:13px;color:var(--ink2)}
.item.on{border-color:var(--mint)}
.item.lock{opacity:.6}
.swatch{width:40px;height:40px;border-radius:12px;margin:0 auto;border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}

/* settings */
.field{margin:10px 0}
.field label{display:block;font-weight:800;margin-bottom:4px}
.field input[type=text],.field select,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px}
.seg button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.switch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.tog{width:58px;height:34px;border-radius:999px;background:#e6d9df;position:relative;flex:none;transition:background .2s}
.tog:after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on{background:var(--mint)}
.tog.on:after{left:28px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(75,53,80,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--bg2);border-radius:28px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto}

/* onboarding */
.center{text-align:center}
.welcome .mimi{width:220px;margin:10px auto}

/* confetti */
.conf{position:fixed;top:-40px;font-size:28px;z-index:60;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:70;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
</style>
</head>
